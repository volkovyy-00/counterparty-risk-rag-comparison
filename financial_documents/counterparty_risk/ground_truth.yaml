# Hand-labelled key: for each company, which taxonomy leaves its Item 1A gives at
# least one dedicated risk factor to (a mention in passing does not count).
#
# A PERSON fills this in with label_tool.py (or by editing below). No code and no
# model writes labels. label_tool.py sets status: verified only when every
# (company, leaf) cell has been decided, and records the labeller's initials and
# the accession numbers labelled against. Until then every screen that shows
# P/R/F1 carries a "DRAFT KEY - not for slides" banner.
#
# Format per corpus:
#   status: unlabelled | draft | verified
#   labels: {TICKER: {yes: [CATEGORY.leaf, ...], no: [CATEGORY.leaf, ...]}}
corpora:
  edgar_latest:
    group: auto_semis
    taxonomy_version: 2
    status: unlabelled
    labeller: ""
    labelled_at: ""
    accessions: {}
    labels: {}
